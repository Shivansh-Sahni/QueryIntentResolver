name: Bootstrap Query Intent Resolver V1 Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/qir-v1-source.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack source bundle
        id: unpack
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.bootstrap/qir-v1-source.part-*)
          if [[ ! -f .bootstrap/qir-v1-source.ready ]] || (( ${#parts[@]} == 0 )); then
            echo "bundle_present=false" >> "$GITHUB_OUTPUT"
            echo "Complete bootstrap bundle is not present; nothing to do."
            exit 0
          fi
          echo "bundle_present=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${parts[@]}" | sort | xargs cat > /tmp/qir-v1-source.tar.gz.b64
          base64 --decode /tmp/qir-v1-source.tar.gz.b64 > /tmp/qir-v1-source.tar.gz
          tar -xzf /tmp/qir-v1-source.tar.gz
          # The repository token cannot create a second workflow. Install all source
          # first, then add the production workflow separately through the GitHub app.
          rm -f .github/workflows/qir-v1-pipeline.yml
          rm -f .bootstrap/qir-v1-source.part-* .bootstrap/qir-v1-source.ready

      - name: Commit complete V1 source
        if: steps.unpack.outputs.bundle_present == 'true'
        run: |
          git config user.name "qir-v1-bootstrap"
          git config user.email "qir-v1-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "Install complete Query Intent Resolver V1 source"
          git push
