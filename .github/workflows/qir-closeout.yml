name: Query Intent Resolver Closeout

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/qir-v1.1-closeout']
    paths:
      - '.github/workflows/qir-closeout.yml'
      - 'v1_1/qir_release/**'
      - 'v1_1/scripts/**'
      - 'v1_1/tests/**'
      - 'v1_1/config/**'
      - 'v1_1/requirements.txt'
      - 'v1_1/data/manual_review_received.csv'
      - 'v1_1/Dockerfile'
  pull_request:
    branches: [main]
    paths: ['v1_1/**', '.github/workflows/qir-closeout.yml']

concurrency:
  group: qir-closeout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-build-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: v1_1
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: v1_1/requirements.txt
      - name: Verify immutable review and applicability input
        run: python v1_1/scripts/materialize_frozen_suite.py
      - name: Install pinned dependencies
        run: python -m pip install -r v1_1/requirements.txt
      - name: Unit and contract tests
        run: |
          mkdir -p v1_1/artifacts/verification
          python -m compileall -q v1_1/qir_release
          pytest -q v1_1/tests --junitxml=v1_1/artifacts/verification/unit_tests.xml
      - name: Execute review integration, grouped modeling and applicability
        run: python -m qir_release.build --repo-root .
      - name: Real HTTP smoke test
        run: |
          uvicorn qir_release.api:app --host 127.0.0.1 --port 8765 > /tmp/qir-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python - <<'PY'
          import time, json, httpx
          from pathlib import Path
          for _ in range(30):
              try:
                  if httpx.get('http://127.0.0.1:8765/ready').status_code == 200:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(1)
          else:
              raise RuntimeError('HTTP runtime did not become ready')
          r=httpx.post('http://127.0.0.1:8765/v1/resolve',json={'query_text':'colleges in California'})
          assert r.status_code==200 and set(r.json())=={'route','confidence'}
          assert httpx.post('http://127.0.0.1:8765/v1/resolve',json={'query_text':''}).status_code==422
          Path('v1_1/artifacts/verification/http_smoke.json').write_text(json.dumps({'status':'passed','transport':'actual_local_http','response':r.json()},indent=2)+'\n')
          PY
      - name: Build and test container
        run: |
          docker build -f v1_1/Dockerfile -t qir-closeout:local .
          docker run --rm qir-closeout:local python -m qir_release 'colleges in California' > /tmp/qir-container.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/qir-container.json').read_text())
          assert set(result)=={'route','confidence'}
          Path('v1_1/artifacts/verification/container_smoke.json').write_text(json.dumps({'status':'passed','response':result},indent=2)+'\n')
          PY
      - name: Final provenance and hashes
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('v1_1')
          assert subprocess.run(['git','diff','--exit-code','--','v1'],check=False).returncode==0
          payload={'status':'passed','workflow_run_id':'${{ github.run_id }}','source_commit':'${{ github.sha }}','original_v1_unchanged':True,'unit_tests':True,'actual_http':True,'docker_build_and_cli':True,'production_authorized':False}
          (root/'artifacts/FINAL_VALIDATION.json').write_text(json.dumps(payload,indent=2)+'\n')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and '__pycache__' not in p.parts and '.pytest_cache' not in p.parts and p.name!='SHA256SUMS.json'}
          (root/'artifacts/SHA256SUMS.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          PY
      - name: Package the complete handoff
        run: |
          tar --exclude='__pycache__' --exclude='.pytest_cache' -czf qir-v1.1-closeout.tar.gz v1_1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qir-closeout-evidence
          path: |
            qir-v1.1-closeout.tar.gz
            v1_1/artifacts/SUMMARY.json
            v1_1/artifacts/verification
          if-no-files-found: warn
          retention-days: 90
      - name: Commit executed artifacts without touching legacy V1
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'qir-closeout-bot'
          git config user.email 'qir-closeout-bot@users.noreply.github.com'
          git add -f v1_1/artifacts v1_1/data/applicability_v1.jsonl v1_1/data/applicability_manifest.json
          git add v1_1/docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record executed V1.1 closeout evidence [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if git rebase "origin/$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
